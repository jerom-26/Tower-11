<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Tower 11 Web3</title>

  <link rel="stylesheet" href="TemplateData/style.css">

  <meta http-equiv="Content-Security-Policy"
        content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; connect-src * 'self' data: blob: wss:;">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

  <script>
    window.addEventListener("load", () => {
      console.log("Page loaded");
      console.log(typeof ethers !== "undefined" ? "Ethers loaded ✅" : "Ethers FAILED ❌");
    });
  </script>

  <script>
    window.checkNFT = async function(wallet) {
      const contractAddress = "0xF6c882D77918160D1D9c35dee0a5a56E9b6AC32C";
      const provider = new ethers.providers.Web3Provider(window.ethereum);
      const abi = ["function balanceOf(address owner) view returns (uint256)"];
      const contract = new ethers.Contract(contractAddress, abi, provider);
      return await contract.balanceOf(wallet);
    };

    window.ConnectWallet = async function () {
      if (typeof ethers === "undefined") {
        console.error("ethers.js not loaded");
        return;
      }

      if (!window.ethereum) {
        console.error("MetaMask not installed");
        return;
      }

      try {
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        const accounts = await provider.send("eth_requestAccounts", []);

        if (!accounts || accounts.length === 0) return;

        const address = accounts[0];
        localStorage.setItem("walletAddress", address);

        if (window.unityInstance) {
          window.unityInstance.SendMessage("WalletManager", "OnWalletConnected", address);
        }

        const balance = await window.checkNFT(address);

        if (window.unityInstance) {
          window.unityInstance.SendMessage("WalletManager", "OnNFTChecked", balance.toString());
        }

      } catch (err) {
        console.error("Web3 error:", err);

        if (window.unityInstance) {
          window.unityInstance.SendMessage("WalletManager", "OnWalletDisconnected", "");
        }
      }
    };

    window.RestoreWalletSession = async function () {
      if (typeof ethers === "undefined" || !window.ethereum) return;

      try {
        const accounts = await window.ethereum.request({ method: "eth_accounts" });

        if (!accounts || accounts.length === 0) {
          localStorage.removeItem("walletAddress");

          if (window.unityInstance) {
            window.unityInstance.SendMessage("WalletManager", "OnWalletDisconnected", "");
          }

          return;
        }

        const wallet = accounts[0];
        localStorage.setItem("walletAddress", wallet);

        if (window.unityInstance) {
          window.unityInstance.SendMessage("WalletManager", "OnWalletConnected", wallet);
        }

        const balance = await window.checkNFT(wallet);

        if (window.unityInstance) {
          window.unityInstance.SendMessage("WalletManager", "OnNFTChecked", balance.toString());
        }

      } catch (err) {
        console.error("Restore session error:", err);

        if (window.unityInstance) {
          window.unityInstance.SendMessage("WalletManager", "OnWalletDisconnected", "");
        }
      }
    };
  </script>
</head>

<body>
  <canvas id="unity-canvas"></canvas>

  <script>
  var canvas = document.querySelector("#unity-canvas");

  var config = {
    dataUrl: "Build/{{{ DATA_FILENAME }}}",
    frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
    codeUrl: "Build/{{{ CODE_FILENAME }}}",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "{{{ COMPANY_NAME }}}",
    productName: "{{{ PRODUCT_NAME }}}",
    productVersion: "{{{ PRODUCT_VERSION }}}"
  };

  var script = document.createElement("script");
  script.src = "Build/{{{ LOADER_FILENAME }}}";

  script.onload = () => {
  createUnityInstance(canvas, config).then((instance) => {
    window.unityInstance = instance;
    console.log("Unity Loaded");

    if (typeof window.RestoreWalletSession === "function") {
      window.RestoreWalletSession();
    }
  });
};

  document.body.appendChild(script);
</script>
</body>
</html>
