<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Tower 11 Web3</title>

  <link rel="stylesheet" href="TemplateData/style.css">

  <meta http-equiv="Content-Security-Policy"
        content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>

  <!-- ✅ LOAD ETHERS (ONLY ONCE, CORRECT PLACE) -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

  <!-- ✅ DEBUG -->
  <script>
    window.addEventListener("load", () => {
      console.log("Page loaded");

      if (typeof ethers !== "undefined") {
        console.log("Ethers loaded ✅");
      } else {
        console.error("Ethers FAILED ❌");
      }
    });
  </script>

  <!-- ✅ WALLET FUNCTION -->
  <script>
    window.connectWallet = async function () {

      if (typeof ethers === "undefined") {
        alert("ethers.js not loaded");
        return;
      }

      if (!window.ethereum) {
        alert("MetaMask not installed");
        return;
      }

      try {
        
        const provider = new ethers.providers.Web3Provider(window.ethereum);

        await provider.send("eth_requestAccounts", []);

        const signer = provider.getSigner();
        const address = await signer.getAddress();

        console.log("Wallet:", address);

        if (window.unityInstance) {
          window.unityInstance.SendMessage(
            "Web3Manager",
            "OnWalletConnected",
            address
          );
        }

        return address;

      } catch (err) {
        console.error(err);
        return "";
      }
    };
  </script>
</head>

<body>
  <canvas id="unity-canvas"></canvas>

  <script>
    var canvas = document.querySelector("#unity-canvas");

    var config = {
    dataUrl: "Build/Tower11_Web3_Final_Build.data",
    frameworkUrl: "Build/Tower11_Web3_Final_Build.framework.js",
    codeUrl: "Build/Tower11_Web3_Final_Build.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "YourCompany",
    productName: "Tower 11",
    productVersion: "1.0"
  };

var script = document.createElement("script");
script.src = "Build/Tower11_Web3_Final_Build.loader.js";

    script.onload = () => {
      createUnityInstance(canvas, config).then((instance) => {
        window.unityInstance = instance;
        console.log("Unity Loaded");
      });
    };
    
    document.body.appendChild(script);
  </script>
</body>
</html>
